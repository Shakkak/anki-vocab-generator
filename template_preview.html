
        <html>
        <head>
            <style>
    .card {
        font-family: arial;
        font-size: 20px;
        text-align: center;
        color: black;
        background-color: white;
    }
    .card-front, .card-back {
        padding: 15px;
    }
    .word {
        font-size: 30px;
        font-weight: bold;
    }
    .front-word {
        font-size: 25px;
        font-weight: bold;
    }
    .section {
        margin-top: 10px;
        text-align: left;
    }
    .label {
        font-weight: bold;
        color: #555;
    }
    .content {
        margin-left: 10px;
    }
    .examples {
        white-space: pre-wrap;
    }
    .antonym {
        color: darkred;
    }
</style>
        </head>
        <body>
            <h2>Card Front Preview</h2>
            <div class="card-front">
    <div class="word">Example Word</div>
    <div class="audio">[sound:example.mp3]</div>
    <div class="hint">Example Hint</div>
</div>
            <h2 style="margin-top: 20px;">Card Back Preview</h2>
            <div class="card-back">
    <div class="front-word"><div class="front-word">Example Word [sound:example.mp3]</div></div>
    <hr>
    
    <div class="section">
        <div class="label">Meaning Definition:</div>
        <div class="content">Example Meaning Definition {{_Audio}}</div>
    </div>
    
    
    <div class="section">
        <div class="label">Synonyms:</div>
        <div class="content">Example Synonyms</div>
    </div>
    
    
    <div class="section">
        <div class="label">Examples:</div>
        <div class="content">Example Examples</div>
    </div>
    
</div>
        </body>
        </html>
